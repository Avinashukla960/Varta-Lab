<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vartalab — Build your English, practise with confidence</title>
<meta name="description" content="Vartalab is a student-focused English communication platform. Learn grammar-first, practise speaking and writing, join communities and compete in weekly IELTS-style contests." />

<!-- ============ STYLES ============ -->
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<!-- ============ NAVBAR ============ -->
<header class="nav">
  <div class="wrap nav-inner">
    <a class="brand" href="#/home" onclick="go('home');return false;">
      <span class="mark"><svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M4 5l7 14L20 5" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      Vart<em>alab</em>
    </a>
    <nav class="nav-links" id="topnav"></nav>
    <div class="nav-cta" id="navcta"></div>
    <button class="burger" id="burger" aria-label="Menu">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h16" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="mobile-menu" id="mmenu"></div>
</header>

<main id="app"></main>

<!-- ============ FOOTER ============ -->
<footer id="footer"></footer>

<!-- ============ MODALS ============ -->
<div class="modal-bg" id="modal" onclick="if(event.target===this)closeModal()"><div class="modal" id="modalBody"></div></div>
<div id="toasts"></div>

<script src="js/11-views-learn.js"></script>
<script src="js/12-views-practice.js"></script>
<script src="js/13-views-arena.js"></script>
<script src="js/14-views-profile.js"></script>
<script src="js/15-views-social.js"></script>
<script src="js/16-views-admin.js"></script>
